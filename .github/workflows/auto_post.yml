name: Auto Generate Jekyll Tech Post

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 KST 09:00
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openai pillow

      - name: Configure Public DNS
        run: |
          # 1. systemd-resolved 비활성화 및 기존 symlink 해제
          sudo systemctl stop systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          
          # 2. 공용 네임서버 직접 생성
          sudo bash -c 'cat << EOF > /etc/resolv.conf
          nameserver 8.8.8.8
          nameserver 1.1.1.1
          options timeout:2 attempts:3
          EOF'
          
          # 3. 도메인 해석 확인 (디버깅용)
          getent hosts models.inference.ai.azure.com || nslookup models.inference.ai.azure.com || true
          
      - name: Run Auto Post Generator
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          python generate_post.py

      - name: Commit and Push generated post and images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 새 포스트 파일과 생성된 이미지 디렉토리 전체 추적
          git add _posts/ assets/images/
          
          git diff --staged --quiet || (git commit -m "chore: auto post with valid technical images [skip ci]" && git push)
